[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatory-rag-assistant"
version = "0.1.0"
description = "Document ingestion and semantic retrieval for a regulatory RAG prototype"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "pypdf>=6,<7",
    "chromadb>=1.5,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
strict = true
